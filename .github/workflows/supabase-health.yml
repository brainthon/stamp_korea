name: Supabase database health check
on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/supabase-health.yml']
permissions: {}
concurrency:
  group: supabase-health
  cancel-in-progress: false
jobs:
  database-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Public client key only. Never use a service-role or secret key here.
      SUPABASE_URL: "https://dyrteyrpimesipypwdpo.supabase.co"
      SUPABASE_PUBLISHABLE_KEY: "sb_publishable_4D9r7eTR-PMjnClzb8enJw_2RQhIz1q"
    steps:
      - name: Read one public catalog ID
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request, urllib.error
          url = os.environ['SUPABASE_URL'] + '/rest/v1/official_stamp_catalog?select=id&limit=1'
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={'apikey': os.environ['SUPABASE_PUBLISHABLE_KEY']})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      rows = json.load(response)
                  if not isinstance(rows, list) or not rows or not rows[0].get('id'):
                      raise ValueError('No readable catalog row')
                  print('OK: public catalog database query succeeded')
                  break
              except Exception as error:
                  print('Database check failed:', type(error).__name__)
                  if attempt == 2:
                      raise SystemExit(1)
                  time.sleep(5)
          PYTHON
